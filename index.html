<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>FlipOff. — Free Split-Flap Display for Any TV</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/tile.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/entry.css">
</head>
<body>

  <section class="entry-screen" id="entry-screen">
    <div class="entry-bg-layer"></div>
    <div class="entry-card">
      <p class="entry-badge">FLIPOFF EXPERIENCE</p>
      <h1>Choose Your Display Mode</h1>
      <p class="entry-subtitle">
        Launch your premium split-flap board in one tap.
        Showcase brings full energy. Sleep keeps it calm and quiet.
      </p>

      <div class="entry-actions">
        <button id="launch-showcase" class="entry-btn entry-btn-primary" type="button">
          <span class="entry-btn-title">Run Showcase</span>
          <span class="entry-btn-meta">Fullscreen, sound on, dynamic flow</span>
        </button>
        <button id="launch-sleep" class="entry-btn entry-btn-secondary" type="button">
          <span class="entry-btn-title">Run Sleep</span>
          <span class="entry-btn-meta">Quiet mode, utility-first display</span>
        </button>
      </div>
    </div>
  </section>

  <div class="page-frame app-hidden" id="app-shell">
    <!-- Header -->
    <header class="header">
      <div class="header-logo">FlipOff.</div>
      <nav class="header-nav">
        <div class="mode-switch" role="tablist" aria-label="Display mode">
          <button class="mode-btn" data-mode="showcase" title="Showcase mode (1)">Showcase</button>
          <button class="mode-btn" data-mode="sleep" title="Sleep mode (2)">Sleep</button>
        </div>
        <button class="volume-icon" id="volume-btn" title="Toggle sound">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
      </nav>
    </header>

    <!-- Hero -->
    <section class="hero">
      <h1>Turn any TV into a retro split-flap display.</h1>
      <p class="subtitle">The classic flip-board look, without the $3,500 hardware.</p>
      <div class="hero-cta">
        <input type="email" placeholder="you@example.com">
        <button id="cta-btn">Get Early Access</button>
      </div>
    </section>

    <!-- Board -->
    <section class="board-section" id="board-container">
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
